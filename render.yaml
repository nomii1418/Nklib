# Render Blueprint for One-Click Deployment
# This file enables one-click deployment to Render
# Just click: https://render.com/deploy

services:
  # Backend API
  - type: web
    name: mechanical-library-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: mechanical_library
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        value: nk28
      - key: ADMIN_PASSWORD
        value: nom
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
    disk:
      name: uploads
      mountPath: /workspace/uploads
      sizeGB: 1

  # Frontend
  - type: web
    name: mechanical-library-web
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # Background Worker for Bot
  - type: worker
    name: mechanical-library-bot
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r bot/requirements.txt"
    startCommand: "python bot/telegram_bot.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ADMIN_USERNAME
        value: nk28
      - key: ADMIN_PASSWORD
        value: nom

databases:
  # Note: Render doesn't provide free MongoDB, use MongoDB Atlas instead
  # https://www.mongodb.com/cloud/atlas/register
